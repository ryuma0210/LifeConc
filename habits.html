<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HABITS - LifeOS FINAL</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;background:#f2f4f8;color:#111827} :root{--primary:#1e3a8a;--danger:#ef4444;--success:#10b981}
.topbar{position:sticky;top:0;z-index:50;background:#fff;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #e5e7eb}
.hamburger{width:48px;height:48px;border:none;background:#fff;border-radius:14px;display:grid;place-items:center}
.logo{display:flex;align-items:center;gap:12px;font-weight:900;font-size:22px}.logo-L{width:40px;height:40px;background:var(--primary);color:#fff;border-radius:12px;display:grid;place-items:center;font-size:20px;font-weight:900}
.drawer{position:fixed;top:0;left:0;bottom:0;width:88%;max-width:340px;background:#fff;z-index:70;transform:translateX(-100%);transition:.3s;display:flex;flex-direction:column}.drawer.show{transform:translateX(0)}.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:60;opacity:0;pointer-events:none;transition:.25s}.overlay.show{opacity:1;pointer-events:auto}
.drawer-head{padding:22px 16px;border-bottom:1px solid #f1f5f9;display:flex;gap:14px;align-items:center}.drawer-avatar{width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:900;font-size:18px}
.drawer-body{flex:1;overflow:auto;padding:14px 10px}.drawer-body a{text-decoration:none;color:inherit}
.drawer-item{display:flex;align-items:center;gap:14px;padding:16px 12px;border-radius:14px;text-decoration:none;color:inherit}.drawer-item.active{background:#f1f5ff}.drawer-item-icon{width:44px;height:44px;border-radius:14px;background:#f3f4f6;display:grid;place-items:center;font-size:20px}.drawer-item-label{font-size:16px;font-weight:700}
.main{padding:0 0 90px}.banner{background:var(--primary);color:#fff;padding:18px 16px 14px;display:flex;align-items:flex-end;justify-content:space-between}.banner-kicker{font-size:11px;letter-spacing:0.08em;opacity:0.7;font-weight:700}.banner-title{font-size:26px;font-weight:900}.banner-count{font-size:34px;font-weight:900}.banner-count-sub{font-size:11px;opacity:0.7}
.tab-bar{display:flex;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:60px;z-index:40}
.tab{flex:1;height:52px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:800;color:#6b7280;border-bottom:3px solid transparent;cursor:pointer}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);background:#f8faff}
.tab-content{display:none}.tab-content.active{display:block}
.list-wrap{padding:12px 10px}
.filter-bar{display:flex;gap:10px;margin-bottom:14px}
.filter-btn{flex:1;height:44px;border-radius:999px;border:1.5px solid #e5e7eb;background:#fff;color:#6b7280;font-size:14px;font-weight:700}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.task-card{background:#fff;border-radius:18px;border:1px solid #eef2f7;box-shadow:0 2px 12px rgba(0,0,0,0.04);padding:16px;margin-bottom:12px;border-left:5px solid var(--primary)}
.task-title{font-size:16px;font-weight:800}.task-meta{font-size:12px;color:#6b7280;margin-top:6px}
.task-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.btn-small{padding:10px 18px;border-radius:999px;border:none;font-size:13px;font-weight:800;cursor:pointer}
.btn-achieve{background:#dcfce7;color:#166534}
.alert-card{margin:12px 10px;padding:16px;border-radius:16px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.alert-danger{background:#fee2e2;border:2px solid #fecaca;color:#991b1b}
.alert-success{background:#dcfce7;border:2px solid #86efac;color:#166534}
.card-form{margin:14px 10px 0;background:#fff;border-radius:24px;box-shadow:0 4px 20px rgba(0,0,0,0.06);padding:20px 16px 24px;border:1px solid #eef2f7}
label{font-size:13px;font-weight:700;color:#374151;margin:16px 0 8px;display:block}
input[type="text"],input[type="number"]{width:100%;font-size:18px;padding:14px 16px;border:1.5px solid #e5e7eb;border-radius:16px;background:#fff;outline:none}
.btn-primary{width:100%;padding:14px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-weight:800;font-size:15px;margin-top:16px}
.status{text-align:center;font-size:12px;color:#16a34a;margin:10px 0;font-weight:600}
</style></head><body>
<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="hamburger" id="btnMenu"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button><div class="logo"><div class="logo-L">L</div> LifeOS FINAL</div></div></header>
<div class="overlay" id="overlay"></div><nav class="drawer" id="drawer"><div class="drawer-head"><div class="drawer-avatar">S</div><div><div style="font-weight:800">Shimizu</div><div style="font-size:11px;color:#6b7280">FINAL 9リンク統一</div></div></div>
<div class="drawer-body">
<a href="index.html"><div class="drawer-item"><div class="drawer-item-icon">🏠</div><div><div class="drawer-item-label">HOME</div></div></div></a>
<a href="tasks.html"><div class="drawer-item"><div class="drawer-item-icon">✅</div><div><div class="drawer-item-label">Tasks</div></div></div></a>

<a href="calendar.html"><div class="drawer-item"><div class="drawer-item-icon">📅</div><div><div class="drawer-item-label">Calendar</div></div></div></a>
<a href="money.html"><div class="drawer-item"><div class="drawer-item-icon">💰</div><div><div class="drawer-item-label">Money</div></div></div></a>
<a href="contacts.html"><div class="drawer-item"><div class="drawer-item-icon">👥</div><div><div class="drawer-item-label">Contacts</div></div></div></a>
<a href="content.html"><div class="drawer-item"><div class="drawer-item-icon">📝</div><div><div class="drawer-item-label">KEEP</div></div></div></a>
<a href="files.html"><div class="drawer-item"><div class="drawer-item-icon">📁</div><div><div class="drawer-item-label">Files</div></div></div></a>
<a href="others.html"><div class="drawer-item"><div class="drawer-item-icon">⚙️</div><div><div class="drawer-item-label">OTHERS</div></div></div></a>
</div></nav>
<main class="main">
<div class="banner"><div><div class="banner-kicker">HABITS / 体重・習慣 / FINAL</div><div class="banner-title">Habits</div></div><div style="text-align:right"><div class="banner-count" id="todayWeightLabel">--kg</div><div class="banner-count-sub">今日</div></div></div>
<div id="weightAlert" class="alert-card alert-danger" style="display:none"><span>⚠️ 今日の体重未入力</span><button class="btn-small" style="background:#fff;color:#991b1b" onclick="document.getElementById('tabInput').click()">入力</button></div>
<div id="weightSuccess" class="alert-card alert-success" style="display:none"><span>✅ 今日記録済み</span><span id="todayWeightLabel2"></span></div>
<div class="tab-bar"><div class="tab active" id="tabConfirm">確認</div><div class="tab" id="tabInput">入力</div><div class="tab" id="tabHistory">履歴</div></div>
<div class="tab-content active" id="contentConfirm"><div class="list-wrap"><div class="filter-bar"><button class="filter-btn active" id="btnWeek" onclick="filterHabits('week')">今週</button><button class="filter-btn" id="btnAll" onclick="filterHabits('all')">全体</button></div><div id="habitsList"></div></div></div>
<div class="tab-content" id="contentInput"><div class="card-form"><div style="font-weight:800">体重入力</div><label>体重 kg</label><input type="number" id="weightInput" step="0.1" placeholder="例 72.5"><label>メモ</label><input type="text" id="weightMemo" placeholder="体調など"><div class="status" id="statusText"></div><button class="btn-primary" onclick="saveWeight()">保存（GAS+ローカル）</button></div></div>
<div class="tab-content" id="contentHistory"><div class="list-wrap"><div id="historyList"></div></div></div>
</main>
<script>
const GAS_URL="https://script.google.com/macros/s/AKfycbzxjjkRqWdKzBR7aKaMObKF7YECMZzPRcaH0-8BHV4Ekp5JVgW9T8Ehy4vO6SMUwS3Y/exec";
const SECRETARY_GAS="https://script.google.com/macros/s/AKfycbzrbzTzcHus3miB8w_YkfXL4NshtfKssUYBqghG6F7FwI608aMr4OturJf1oUZ1Wcb7/exec";
const drawer=document.getElementById('drawer'),overlay=document.getElementById('overlay'),btn=document.getElementById('btnMenu');
function openDrawer(){drawer.classList.add('show');overlay.classList.add('show')}
function closeDrawer(){drawer.classList.remove('show');overlay.classList.remove('show')}
btn.addEventListener('click',openDrawer);overlay.addEventListener('click',closeDrawer);
const tabConfirm=document.getElementById('tabConfirm'),tabInput=document.getElementById('tabInput'),tabHistory=document.getElementById('tabHistory');
const contentConfirm=document.getElementById('contentConfirm'),contentInput=document.getElementById('contentInput'),contentHistory=document.getElementById('contentHistory');
function switchTab(name){
  [tabConfirm,tabInput,tabHistory].forEach(t=>t.classList.remove('active'));
  [contentConfirm,contentInput,contentHistory].forEach(c=>c.classList.remove('active'));
  if(name==='confirm'){tabConfirm.classList.add('active');contentConfirm.classList.add('active');}
  if(name==='input'){tabInput.classList.add('active');contentInput.classList.add('active');}
  if(name==='history'){tabHistory.classList.add('active');contentHistory.classList.add('active');renderHistory();}
}
tabConfirm.addEventListener('click',()=>switchTab('confirm'));
tabInput.addEventListener('click',()=>switchTab('input'));
tabHistory.addEventListener('click',()=>switchTab('history'));
let habits=[
  {id:'H-001',title:'体重 70kgキープ',freq:'毎日',streak:12,filter:'week',color:'#f59e0b'},
  {id:'H-002',title:'洗濯 / 掃除',freq:'毎日',streak:5,filter:'week',color:'#10b981'},
  {id:'H-003',title:'ランニング 5km',freq:'週3回',streak:2,filter:'week',color:'#3b82f6',progress:'2/3'},
  {id:'H-004',title:'読書 30分',freq:'毎日',filter:'all',color:'#9ca3af'},
  {id:'H-005',title:'瞑想 10分',freq:'毎日',filter:'all',color:'#9ca3af'}
];
function getTodayKey(){return new Date().toISOString().slice(0,10);}
function loadLogs(){try{return JSON.parse(localStorage.getItem('lifeos_weight_logs')||'[]')}catch(e){return []}}
function saveLogs(logs){localStorage.setItem('lifeos_weight_logs',JSON.stringify(logs));}
function checkWeightToday(){
  const logs=loadLogs();
  const today=getTodayKey();
  const todayLog=logs.find(l=>l.date===today && l.type==='weight');
  const alertEl=document.getElementById('weightAlert');
  const successEl=document.getElementById('weightSuccess');
  const label=document.getElementById('todayWeightLabel');
  if(todayLog){
    alertEl.style.display='none';
    successEl.style.display='flex';
    label.textContent=todayLog.value+'kg';
  }else{
    alertEl.style.display='flex';
    successEl.style.display='none';
  }
}
function saveWeight(){
  const w=document.getElementById('weightInput').value;
  const memo=document.getElementById('weightMemo').value;
  if(!w){alert('体重を入力してください');return;}
  const today=getTodayKey();
  const log={date:today,type:'weight',value:parseFloat(w),memo:memo,ts:new Date().toISOString()};
  const logs=loadLogs();
  const idx=logs.findIndex(l=>l.date===today && l.type==='weight');
  if(idx>=0) logs[idx]=log; else logs.push(log);
  saveLogs(logs);
  document.getElementById('statusText').textContent='✅ 保存しました！ '+w+'kg';
  try{
    fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'add',task:'体重 '+w+'kg',content:memo,category:'健康/習慣',schedule:'毎日',priority:'習慣',status:'完了',memo:'体重記録 '+w+'kg'})});
  }catch(e){}
  setTimeout(()=>{checkWeightToday();renderHistory();switchTab('confirm');},800);
}
function quickAchieve(name){
  const today=getTodayKey();
  const log={date:today,type:'habit',value:name,ts:new Date().toISOString()};
  const logs=loadLogs();
  logs.push(log);
  saveLogs(logs);
  alert('✅ '+name+' 達成！');
  renderHabits();renderHistory();
}
function renderHabits(){
  const list=document.getElementById('habitsList');
  let html='';
  const logs=loadLogs();
  const today=getTodayKey();
  habits.forEach(h=>{
    const achievedToday=logs.some(l=>l.date===today && l.type==='habit' && l.value===h.title.split(' ')[0]) || (h.id==='H-001' && logs.some(l=>l.date===today && l.type==='weight'));
    html+=`<div class="task-card" data-filter="${h.filter}" style="border-left-color:${h.color}">
      <div class="task-title">${h.title} ${achievedToday?'✅':''}</div>
      <div class="task-meta">${h.freq} ${h.streak?' / 連続'+h.streak+'日':''} / ${h.filter==='week'?'今週':'全体'}</div>
      <div class="task-actions">${!achievedToday?`<button class="btn-small btn-achieve" onclick="quickAchieve('${h.title.split(' ')[0]}')">✅ 今日達成</button>`:`<span style="font-size:12px;color:#16a34a;font-weight:800">今日達成済み</span>`}</div>
    </div>`;
  });
  list.innerHTML=html;
}
function renderHistory(){
  const list=document.getElementById('historyList');
  const logs=loadLogs().slice().reverse();
  if(logs.length===0){list.innerHTML='<div class="task-card">履歴なし</div>';return;}
  let html='';
  logs.slice(0,30).forEach(l=>{
    if(l.type==='weight'){
      html+=`<div class="task-card" style="border-left-color:#f59e0b"><div class="task-title">⚖️ ${l.value}kg</div><div class="task-meta">${l.date} / ${l.memo||''}</div></div>`;
    }else{
      html+=`<div class="task-card" style="border-left-color:#10b981"><div class="task-title">✅ ${l.value}</div><div class="task-meta">${l.date}</div></div>`;
    }
  });
  list.innerHTML=html;
}
function filterHabits(type){
  document.getElementById('btnWeek').classList.toggle('active', type==='week');
  document.getElementById('btnAll').classList.toggle('active', type==='all');
  const cards=document.querySelectorAll('#habitsList .task-card');
  cards.forEach(c=>{
    if(type==='week'){c.style.display=c.dataset.filter==='week'?'block':'none';} else {c.style.display='block';}
  });
}
checkWeightToday();renderHabits();renderHistory();
</script>
</body></html>
