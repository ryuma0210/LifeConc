<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CALENDAR - LifeOS</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;background:#f2f4f8;color:#111827} :root{--primary:#1e3a8a}
.topbar{position:sticky;top:0;z-index:50;background:#fff;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #e5e7eb}
.hamburger{width:48px;height:48px;border:none;background:#fff;border-radius:14px;display:grid;place-items:center}
.logo{display:flex;align-items:center;gap:12px;font-weight:900;font-size:22px}.logo-L{width:40px;height:40px;background:var(--primary);color:#fff;border-radius:12px;display:grid;place-items:center;font-size:20px;font-weight:900}
.drawer{position:fixed;top:0;left:0;bottom:0;width:88%;max-width:340px;background:#fff;z-index:70;transform:translateX(-100%);transition:.3s;display:flex;flex-direction:column}.drawer.show{transform:translateX(0)}.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:60;opacity:0;pointer-events:none;transition:.25s}.overlay.show{opacity:1;pointer-events:auto}
.drawer-head{padding:22px 16px;border-bottom:1px solid #f1f5f9;display:flex;gap:14px;align-items:center}.drawer-avatar{width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:900;font-size:18px}.drawer-body{flex:1;overflow:auto;padding:14px 10px}.drawer-item{display:flex;align-items:center;gap:14px;padding:16px 12px;border-radius:14px;text-decoration:none;color:inherit}.drawer-item.active{background:#f1f5ff}.drawer-item-icon{width:44px;height:44px;border-radius:14px;background:#f3f4f6;display:grid;place-items:center;font-size:20px}.drawer-item-label{font-size:16px;font-weight:700}
.main{padding:0 0 90px}.banner{background:var(--primary);color:#fff;padding:18px 16px 14px;display:flex;align-items:flex-end;justify-content:space-between}.banner-kicker{font-size:11px;letter-spacing:0.08em;opacity:0.7;font-weight:700}.banner-title{font-size:26px;font-weight:900}.banner-count{font-size:34px;font-weight:900}.banner-count-sub{font-size:11px;opacity:0.7}
.list-wrap{padding:12px 10px}
.filter-bar{display:flex;gap:10px;margin:16px 0 14px}
.filter-btn{flex:1;height:48px;border-radius:999px;border:1.5px solid #e5e7eb;background:#fff;color:#6b7280;font-size:15px;font-weight:700}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.task-card{background:#fff;border-radius:18px;border:1px solid #eef2f7;box-shadow:0 2px 12px rgba(0,0,0,0.04);padding:16px;margin-bottom:12px;border-left:5px solid var(--primary)}
.task-title{font-size:15px;font-weight:800}
.task-meta{font-size:11px;color:#6b7280;margin-top:6px}
.calendar-wrap{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.04);border:1px solid #eef2f7;padding:16px}
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{min-height:62px;border:1px solid #eef2f7;border-radius:12px;padding:6px;font-size:12px;background:#fff}
.cal-cell.today{border-color:var(--primary);background:#f1f5ff}
.cal-cell.has-task{background:#dbeafe;border-color:#93c5fd}
.cal-day-num{font-weight:800;font-size:13px}
.cal-task-dot{width:6px;height:6px;background:#ef4444;border-radius:50%;display:inline-block;margin-left:2px}
.cal-task-label{font-size:10px;margin-top:2px;color:#1e3a8a;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-secondary{padding:10px 16px;border:1.5px solid #e5e7eb;border-radius:999px;background:#fff;color:#111827;font-weight:700;font-size:13px}
</style></head><body>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzxjjkRqWdKzBR7aKaMObKF7YECMZzPRcaH0-8BHV4Ekp5JVgW9T8Ehy4vO6SMUwS3Y/exec";
const drawer=document.getElementById('drawer'),overlay=document.getElementById('overlay'),btn=document.getElementById('btnMenu');
function openDrawer(){drawer.classList.add('show');overlay.classList.add('show')}
function closeDrawer(){drawer.classList.remove('show');overlay.classList.remove('show')}
btn.addEventListener('click',openDrawer);overlay.addEventListener('click',closeDrawer);
let tasks=[],cur='week';
let currentYear=2026, currentMonth=9;
function loadTasks(){
  fetch(GAS_URL).then(r=>r.json()).then(data=>{
    tasks = data.filter(d=> d.id && String(d.id).startsWith('T-') && d.schedule && d.schedule!=='毎日');
    renderAll();
  }).catch(()=>{
    tasks = [
      {id:'T-001',task:'LifeOS秘書 V3',schedule:'2026-10-09',priority:'急ぎ'},
      {id:'T-010',task:'書類整理',schedule:'2026-10-16',priority:'任せる/後から'},
      {id:'T-014',task:'天草の契約',schedule:'2026-10-13 9:00',priority:'時間をとる',memo:'火曜日に契約書'},
      {id:'T-015',task:'久留米警察署 徳永さん',schedule:'2026-10-15',priority:'急ぎ'},
    ];
    renderAll();
  });
}
function renderAll(){ renderCalendar(); renderList(); }
function setFilter(type){
  cur=type;
  document.getElementById('btnWeek').classList.toggle('active', type==='week');
  document.getElementById('btnAll').classList.toggle('active', type==='all');
  renderList();
}
function changeMonth(delta){
  currentMonth+=delta;
  if(currentMonth>11){currentMonth=0;currentYear++;}
  if(currentMonth<0){currentMonth=11;currentYear--;}
  renderCalendar();
}
function renderCalendar(){
  const grid=document.getElementById('calGrid');
  const label=document.getElementById('calMonthLabel');
  if(label) label.textContent=`${currentYear}年 ${currentMonth+1}月`;
  const daysInMonth=new Date(currentYear, currentMonth+1, 0).getDate();
  const firstDay=new Date(currentYear, currentMonth, 1).getDay();
  const today=new Date();
  let html='';
  for(let i=0;i<firstDay;i++) html+='<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const matched=tasks.filter(t=>{
      if(!t.schedule) return false;
      if(t.schedule.includes(dateStr)) return true;
      if(t.schedule.startsWith(dateStr)) return true;
      return false;
    });
    const isToday = today.getFullYear()===currentYear && today.getMonth()===currentMonth && today.getDate()===d;
    let cls='cal-cell';
    if(isToday) cls+=' today';
    if(matched.length>0) cls+=' has-task';
    let inner=`<div class="cal-day-num">${d}${matched.length>0 ? `<span class="cal-task-dot"></span>` : ''}</div>`;
    matched.slice(0,2).forEach(t=>{
      inner+=`<div class="cal-task-label">${esc(t.task.substring(0,10))}</div>`;
    });
    if(matched.length>2) inner+=`<div class="cal-task-label">+${matched.length-2}件</div>`;
    html+=`<div class="${cls}" onclick="filterByDate('${dateStr}')">${inner}</div>`;
  }
  grid.innerHTML=html;
}
function filterByDate(dateStr){
  setFilter('all');
  const list=document.getElementById('taskCalendarList');
  const filtered=tasks.filter(t=> t.schedule && (t.schedule.includes(dateStr) || t.schedule.startsWith(dateStr)));
  if(filtered.length===0) return;
  let html='';
  filtered.forEach(t=>{
    let color=t.priority==='急ぎ' ? '#ef4444' : t.priority==='時間をとる' ? '#f59e0b' : '#1e3a8a';
    html+=`<div class="task-card" style="border-left-color:${color}"><div class="task-title">📅 ${esc(t.schedule)} - ${esc(t.task)}</div><div class="task-meta">${esc(t.id)} / ${esc(t.priority||'')} / ${esc(t.memo||'')}</div></div>`;
  });
  list.innerHTML=html;
  document.getElementById('filterInfo').textContent=`${dateStr}：${filtered.length}件`;
  document.getElementById('bannerCount').textContent=filtered.length;
}
function renderList(){
  const list=document.getElementById('taskCalendarList');
  const banner=document.getElementById('bannerCount');
  const info=document.getElementById('filterInfo');
  let filtered = tasks;
  if(cur==='week'){
    filtered = tasks.filter(t=> t.schedule && t.schedule.includes('2026-10-'));
  }
  if(banner) banner.textContent=filtered.length;
  if(info) info.textContent= cur==='week' ? `今週：${filtered.length}件` : `全体：${filtered.length}件 / TASKS Master連動`;
  let html='';
  filtered.forEach(t=>{
    let color=t.priority==='急ぎ' ? '#ef4444' : t.priority==='時間をとる' ? '#f59e0b' : '#1e3a8a';
    html+=`<div class="task-card" style="border-left-color:${color}"><div class="task-title">📅 ${esc(t.schedule)} - ${esc(t.task)}</div><div class="task-meta">${esc(t.id)} / ${esc(t.priority||'')} / ${esc(t.memo||'')}</div></div>`;
  });
  if(html==='') html='<div class="task-card"><div class="task-title">日付付きタスクなし</div><div class="task-meta">TASKS Masterのスケジュール列に「2026-10-13 9:00」の形式で日付を入れると表示されます</div></div>';
  list.innerHTML=html;
}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
loadTasks();
</script>
