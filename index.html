<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOME - LifeOS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;background:#f2f4f8;color:#111827}
:root{--primary:#1e3a8a}
.topbar{position:sticky;top:0;z-index:50;background:#fff;height:60px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #e5e7eb}
.hamburger{width:48px;height:48px;border:none;background:#fff;border-radius:14px;display:grid;place-items:center;cursor:pointer}
.logo{display:flex;align-items:center;gap:12px;font-weight:900;font-size:22px}
.logo-L{width:40px;height:40px;background:var(--primary);color:#fff;border-radius:12px;display:grid;place-items:center;font-size:20px;font-weight:900}
.banner{background:var(--primary);color:#fff;padding:18px 16px 14px;display:flex;align-items:flex-end;justify-content:space-between}
.banner-kicker{font-size:11px;letter-spacing:0.08em;opacity:0.7;font-weight:700}
.banner-title{font-size:26px;font-weight:900}
.banner-count{font-size:34px;font-weight:900;line-height:1}
.banner-count-sub{font-size:11px;opacity:0.7;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 10px}
.card{background:#fff;border-radius:18px;border:1px solid #eef2f7;padding:18px 16px;display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;box-shadow:0 2px 12px rgba(0,0,0,0.04);border-left:5px solid var(--primary);min-height:68px;transition:.15s}
.card:active{transform:scale(0.97)}
.icon{font-size:18px;width:28px;text-align:center}
.label{font-size:15px;font-weight:800}
.drawer{position:fixed;top:0;left:0;bottom:0;width:88%;max-width:340px;background:#fff;z-index:70;transform:translateX(-100%);transition:.3s;display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:60;opacity:0;pointer-events:none;transition:.25s}
.overlay.show{opacity:1;pointer-events:auto}
.drawer-head{padding:22px 16px;border-bottom:1px solid #f1f5f9;display:flex;gap:14px;align-items:center}
.drawer-avatar{width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:900;font-size:18px}
.drawer-body{flex:1;overflow:auto;padding:14px 10px}
.drawer-item{display:flex;align-items:center;gap:14px;padding:16px 12px;border-radius:14px;text-decoration:none;color:inherit;cursor:pointer}
.drawer-item.active{background:#f1f5ff}
.drawer-item-icon{width:44px;height:44px;border-radius:14px;background:#f3f4f6;display:grid;place-items:center;font-size:20px}
.drawer-item-label{font-size:16px;font-weight:700}
</style>
</head>
<body>
<header class="topbar">
<div style="display:flex;align-items:center;gap:12px">
<button class="hamburger" id="btnMenu"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
<div class="logo"><div class="logo-L">L</div> LifeOS</div>
</div>
</header>
<div class="overlay" id="overlay"></div>
<nav class="drawer" id="drawer">
<div class="drawer-head"><div class="drawer-avatar">S</div><div><div style="font-weight:800">Shimizu</div><div style="font-size:12px;color:#6b7280">LifeOS Portal</div></div></div>
<div class="drawer-body">
<a href="index.html" class="drawer-item active"><div class="drawer-item-icon">🏠</div><div class="drawer-item-label">HOME</div></a>
<a href="tasks.html" class="drawer-item"><div class="drawer-item-icon">✅</div><div class="drawer-item-label">Tasks</div></a>
<a href="habits.html" class="drawer-item"><div class="drawer-item-icon">💪</div><div class="drawer-item-label">Habits</div></a>
<a href="calendar.html" class="drawer-item"><div class="drawer-item-icon">📅</div><div class="drawer-item-label">Calendar</div></a>
<a href="money.html" class="drawer-item"><div class="drawer-item-icon">💰</div><div class="drawer-item-label">Money</div></a>
<a href="contacts.html" class="drawer-item"><div class="drawer-item-icon">👥</div><div class="drawer-item-label">Contacts</div></a>
<a href="content.html" class="drawer-item"><div class="drawer-item-icon">📝</div><div class="drawer-item-label">KEEP</div></a>
<a href="others.html" class="drawer-item"><div class="drawer-item-icon">⚙️</div><div class="drawer-item-label">OTHERS</div></a>
<a href="files.html" class="drawer-item"><div class="drawer-item-icon">📁</div><div class="drawer-item-label">ファイル一覧</div></a>
</div>
</nav>
<main>
<div class="banner">
<div><div class="banner-kicker">LIFEOS PORTAL</div><div class="banner-title">HOME</div></div>
<div style="text-align:right"><div class="banner-count">8</div><div class="banner-count-sub">アプリ</div></div>
</div>
<div class="grid">
<a href="tasks.html" class="card" style="border-left-color:#1e3a8a"><span class="icon">✅</span><span class="label">Tasks</span></a>
<a href="habits.html" class="card" style="border-left-color:#10b981"><span class="icon">💪</span><span class="label">Habits</span></a>
<a href="calendar.html" class="card" style="border-left-color:#3b82f6"><span class="icon">📅</span><span class="label">Calendar</span></a>
<a href="money.html" class="card" style="border-left-color:#f59e0b"><span class="icon">💰</span><span class="label">Money</span></a>
<a href="contacts.html" class="card" style="border-left-color:#7c3aed"><span class="icon">👥</span><span class="label">Contacts</span></a>
<a href="content.html" class="card" style="border-left-color:#ec4899"><span class="icon">📝</span><span class="label">KEEP</span></a>
<a href="others.html" class="card" style="border-left-color:#6b7280"><span class="icon">⚙️</span><span class="label">OTHERS</span></a>
<a href="files.html" class="card" style="border-left-color:#1e3a8a"><span class="icon">📁</span><span class="label">ファイル一覧</span></a>
</div>
<div style="text-align:center;padding:20px 10px;font-size:11px;color:#9ca3af">LifeOS v2 FINAL - 2026-10-17<br>8ボタン＋ハンバーガー全て遷移可能</div>
</main>
<script>
const drawer=document.getElementById('drawer'),overlay=document.getElementById('overlay'),btn=document.getElementById('btnMenu');
function openDrawer(){drawer.classList.add('show');overlay.classList.add('show')}
function closeDrawer(){drawer.classList.remove('show');overlay.classList.remove('show')}
btn.addEventListener('click',openDrawer);
overlay.addEventListener('click',closeDrawer);
document.querySelectorAll('.drawer-body a').forEach(a=>{a.addEventListener('click',()=>{closeDrawer();})});
</script>
</body>
</html>
